<title>Palier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* DA des captures : noir, blanc, gris. La couleur n'existe que dans les graphiques.
   Mise en page : lecture en haut, gestes dans la moitié basse, un panneau = un objet.
   Mouvement permanent : bandeau, surface de points, tracés, points pulsés (coupé si l'appareil le demande). */
:root{
  --bg:#000; --p1:#090909; --p2:#121212; --line:#262626; --line2:#3b3b3b;
  --fg:#f4f4f4; --mut:#8e8e8e; --dim:#5c5c5c;
  --gain:#4fe3a1; --loss:#e8736c; --mc:#8f6bff; --tv:#2962ff; --cbg:#0e0e0f;
  --f-d:"Archivo",system-ui,sans-serif; --f-m:"JetBrains Mono",ui-monospace,monospace;
  --nav-h:68px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-d);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 30px)}
.m{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.gain{color:var(--gain)}.loss{color:var(--loss)}.mut{color:var(--mut)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.brand{font:600 11px var(--f-m);letter-spacing:.28em;text-transform:uppercase}
.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:9px;animation:blink 1.6s ease-in-out infinite}
.sync{font:500 10.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line2);padding:4px 9px;border-radius:3px}
.sync.ok{color:var(--fg)}
.tape{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);padding:6px 0;font:500 10.5px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape span{display:inline-block;padding-right:2.4em;animation:tape 38s linear infinite}
.tape b{color:var(--fg);font-weight:600}
@keyframes tape{to{transform:translateX(-100%)}}
@keyframes blink{50%{opacity:.25}}

main{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.sub{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sub button{min-height:44px;border:0;background:none;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);border-right:1px solid var(--line)}
.sub button:last-child{border-right:0}
.sub button[aria-selected="true"]{background:#fff;color:#000;font-weight:600}
.panel{background:rgba(3,5,9,.78);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;position:relative}
.eyebrow{font:500 10.5px var(--f-m);letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.eyebrow::before{content:"// ";color:var(--dim)}
h2.t{margin:0;font:800 29px/1.05 var(--f-d);letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
h3.t{margin:0 0 6px;font:800 17px/1.15 var(--f-d);text-transform:uppercase;letter-spacing:.01em}
.lede{color:var(--mut);margin:10px 0 0;font-size:14px}
.hero{overflow:hidden;padding-top:22px;--th:230px}
.numeral{position:absolute;right:10px;top:-8px;font:800 112px/1 var(--f-d);color:rgba(255,255,255,.07);letter-spacing:-.04em;pointer-events:none;user-select:none}
.hero>*:not(canvas):not(.numeral){position:relative;z-index:1}
canvas.flow{width:100%;display:block;background:var(--cbg);border:1px solid var(--line);border-radius:8px}
canvas.terr.bgterr{position:fixed;left:0;top:0;width:100%;height:100lvh;z-index:0;opacity:.5;-webkit-mask-image:none;mask-image:none}
canvas.terr{position:absolute;left:0;top:0;width:100%;height:var(--th);z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,#000 62%,transparent 100%)}
.hero::after{content:"";position:absolute;left:0;top:0;width:100%;height:var(--th);z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.74) 52%,rgba(0,0,0,.12) 100%);-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,#000 62%,transparent 100%)}
canvas.surf{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.8;pointer-events:none}
.cap{font:400 10px/1.5 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:10px 0 0}
.mu,.stat span .mu{text-transform:none!important;display:inline!important;font:inherit;letter-spacing:0}
.cap b{color:var(--fg);font-weight:600;margin-right:8px}
.big{font:600 36px/1.05 var(--f-m);letter-spacing:-.04em}
.big small{font-size:14px;color:var(--mut);font-weight:400;letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:rgba(3,5,9,.6);padding:11px 11px 12px;min-width:0}
.stat span{display:block;font:500 9.5px/1.3 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.stat strong{display:block;font:600 16px/1.35 var(--f-m);margin-top:5px;overflow-wrap:anywhere}
.bar{height:6px;background:#1a1a1a;margin:14px 0 6px;position:relative;overflow:hidden}
.bar>b{display:block;height:100%;background:#fff;transition:width .6s}
.bar.risk>b{background:var(--gain)}.bar.risk.warn>b{background:#e9b44c}.bar.risk.crit>b{background:var(--loss)}
.legend{display:flex;justify-content:space-between;font:400 10.5px var(--f-m);color:var(--mut);letter-spacing:.06em}
.meter+.meter{margin-top:20px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.tag{font:500 10px var(--f-m);letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line2);border-radius:3px;color:var(--mut)}
.tag.ok{color:var(--gain);border-color:var(--gain)}.tag.warn{color:#e9b44c;border-color:#e9b44c}.tag.crit{color:var(--loss);border-color:var(--loss)}

.btn{min-height:52px;border-radius:8px;border:1px solid var(--line2);background:var(--p2);font:600 13px var(--f-m);letter-spacing:.08em;text-transform:uppercase;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:#fff;border-color:#fff;color:#000}
.btn.block{width:100%}.btn.ghost{background:transparent}.btn.danger{color:var(--loss)}
.link{background:none;border:0;color:var(--fg);font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;min-height:48px;padding:0 4px;text-decoration:underline;text-underline-offset:4px}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;color:var(--mut)}

.list{display:flex;flex-direction:column;gap:8px}
.month{font:500 10.5px var(--f-m);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:12px 2px 0}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(3,5,9,.78);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:64px}
.row .d{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.row .d b{font:600 19px var(--f-m)}.row .d span{font:500 9.5px var(--f-m);color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.row .t{min-width:0}.row .t strong{display:block;font-size:14px;font-weight:600}.row .t span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p{font:600 16px var(--f-m)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);border-radius:99px;padding:7px 13px;font:500 11.5px var(--f-m);color:var(--mut)}
.chip b{color:var(--fg);font-weight:600}
button.chip{background:none;min-height:44px}
button.chip[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}

.field{display:flex;flex-direction:column;gap:6px}.field+.field{margin-top:14px}
.field label,.lab{font:500 10.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.field .hint{font-size:12px;color:var(--dim)}
.input{display:flex;align-items:center;background:var(--p2);border:1px solid var(--line2);border-radius:8px;min-height:50px;padding:0 14px;gap:8px}
.input:focus-within{border-color:#fff}
.input input,.input select{flex:1;min-width:0;background:none;border:0;outline:0;font:500 16px var(--f-m);min-height:48px}
.input em{font-style:normal;color:var(--mut);font:500 13px var(--f-m)}
textarea.ta{width:100%;min-height:96px;background:var(--p2);border:1px solid var(--line2);border-radius:8px;padding:12px 14px;font:400 15px/1.5 var(--f-d);resize:vertical}
textarea.ta:focus{outline:0;border-color:#fff}
textarea.mono{font:400 13px/1.5 var(--f-m)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{min-height:46px;border:0;border-right:1px solid var(--line2);background:none;font:500 11.5px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:#fff;color:#000;font-weight:600}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:56px;width:100%;background:none;border:0;text-align:left;padding:0}
.switch .l{display:flex;flex-direction:column;font-weight:600}.switch .l small{font-weight:400;color:var(--mut);font-size:12.5px}
.sw{flex:none;width:50px;height:28px;border-radius:99px;border:1px solid var(--line2);background:var(--p2);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}
[aria-checked="true"]>.sw{background:#fff;border-color:#fff}
[aria-checked="true"]>.sw::after{transform:translateX(22px);background:#000}
.divider{height:1px;background:var(--line);margin:16px 0}
input[type=range]{width:100%;height:48px;background:none;-webkit-appearance:none;appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-12px;border:0}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}

table.t{width:100%;border-collapse:collapse;font:400 11.5px/1.4 var(--f-m)}
table.t th{font-weight:500;text-align:left;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;font-size:9.5px;padding:6px 6px 6px 0;border-bottom:1px solid var(--line2)}
table.t td.m{white-space:nowrap}
table.t td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.scrollx{overflow-x:auto}
.map{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:400 12px/1.4 var(--f-m);margin-top:14px}
.map dt{color:var(--fg);font-weight:600;letter-spacing:.06em}.map dd{margin:0;color:var(--mut)}

/* Graphiques à la TradingView : échelle à droite, étiquette de dernier prix, viseur. */
svg.tvs{width:100%;height:auto;display:block;touch-action:pan-y;background:var(--cbg);border:1px solid var(--line);border-radius:6px}
svg.tvs text{font:500 10px var(--f-m);fill:#9d9d9d}
svg.tvs .gl{stroke:#1b1b1d;stroke-width:1}
svg.tvs .tg text{fill:#000;font-weight:600}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}
@keyframes pulse{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.march{stroke-dasharray:5 4;animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-9}}
.fadein{animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.xh{display:none;pointer-events:none}.xh.on{display:block}
.xh line{stroke:#bdbdbd;stroke-dasharray:3 3;stroke-width:1}

/* Accordéons d'outils */
.tool{border:1px solid var(--line);border-radius:12px;background:rgba(3,5,9,.78);overflow:hidden}
.tool>button{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:none;border:0;text-align:left}
.tool>button b{font:800 15px var(--f-d);text-transform:uppercase;letter-spacing:.02em}
.tool>button span{font:500 10px var(--f-m);letter-spacing:.16em;color:var(--mut)}
.tool .body{display:none;padding:2px 18px 20px;border-top:1px solid var(--line)}
.tool.on .body{display:block;animation:fadein .35s ease}
.tool.on>button span{color:var(--fg)}
.out{margin-top:16px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(0,0,0,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;height:calc(var(--nav-h) - 6px);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
.tab{height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 9.5px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:#fff}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center;margin-top:-26px;box-shadow:0 0 0 5px var(--bg),0 0 24px rgba(255,255,255,.18)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;background:var(--p1);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;
  max-height:92dvh;overflow:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);visibility:hidden;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none;visibility:visible}
.grab{width:44px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet h2{font:800 20px var(--f-d);text-transform:uppercase;margin:2px 0 14px}
.amount input{font:600 38px/1 var(--f-m)!important;min-height:68px!important}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.quick button{min-height:48px;flex:1 1 60px;border-radius:8px;border:1px solid var(--line2);background:var(--p2);font:600 14px var(--f-m)}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{min-height:52px;border-radius:8px;border:1px solid var(--line2);background:var(--p2);font-size:22px}
.stepper output{text-align:center;font:600 20px var(--f-m)}
.actions{display:flex;gap:10px;margin-top:20px}.actions .btn.primary{flex:1}
body[data-hand="left"] .actions{flex-direction:row-reverse}
.err{color:var(--loss);font:500 12px var(--f-m);min-height:18px;margin:6px 2px 0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);z-index:70;background:#fff;color:#000;padding:12px 18px;border-radius:6px;font:600 12px var(--f-m);letter-spacing:.06em;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{border:1px dashed #fff;border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 12px var(--f-m);letter-spacing:.06em;text-transform:uppercase}
.zones{position:fixed;inset:0;z-index:55;pointer-events:none;display:none}.zones.on{display:block}
.zones.r{background:radial-gradient(circle 600px at 100% 100%,rgba(79,227,161,.26) 0 190px,rgba(233,180,76,.22) 190px 330px,rgba(232,115,108,.2) 330px 600px,transparent 600px)}
.zones.l{background:radial-gradient(circle 600px at 0% 100%,rgba(79,227,161,.26) 0 190px,rgba(233,180,76,.22) 190px 330px,rgba(232,115,108,.2) 330px 600px,transparent 600px)}
canvas.heat{width:100%;max-width:230px;aspect-ratio:9/16;border:1px solid var(--line2);border-radius:8px;background:var(--p2);display:block}
.paper h1{font:800 26px/1.08 var(--f-d);text-transform:uppercase;letter-spacing:-.01em;margin:6px 0 10px;text-wrap:balance}
.paper .meta{font:400 11px/1.7 var(--f-m);color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.paper .meta b{color:var(--fg);font-weight:600}
.paper h3.sec{font:800 14px var(--f-d);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
.paper h3.sec i{font:500 11px var(--f-m);color:var(--dim);font-style:normal}
.paper p{margin:0 0 10px}
.verdict{font:600 12px var(--f-m);letter-spacing:.06em;text-transform:uppercase;border-left:3px solid #fff;padding:6px 0 6px 12px;margin-top:14px}
.inl{background:none;border:0;border-bottom:1px solid var(--line2);width:100%;font:800 24px/1.1 var(--f-d);text-transform:uppercase;padding:2px 0 8px;min-height:44px;resize:none;display:block;color:var(--fg)}
.inl:focus{outline:0;border-color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style>

<canvas class="terr bgterr" data-terr="bg" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="bar"><span class="brand"><i></i>Palier</span><span class="sync" id="sync">Local</span></div>
    <div class="tape" aria-hidden="true"><span id="tape"></span></div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabs" aria-label="Navigation principale"><div class="in" role="tablist">
  <button class="tab" role="tablist" data-go="apercu" data-grp="apercu"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-3H4z"/></svg>Aperçu</button>
  <button class="tab" data-go="challenge" data-grp="challenge"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 17c4 0 5-3 7-8s4-5 7-5"/></svg>Option</button>
  <button class="fab" data-act="new" aria-label="Nouvelle séance"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-go="quant" data-grp="quant"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Quant</button>
  <button class="tab" data-go="paper" data-grp="paper"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg>Paper</button>
</div></nav>

<div class="scrim" id="scrim" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
  <div class="grab"></div><h2 id="sheet-t">Nouvelle séance</h2>
  <div class="seg" id="sign" role="group" aria-label="Résultat"><button type="button" data-sign="1" aria-pressed="true">▲ Gain</button><button type="button" data-sign="-1" aria-pressed="false">▼ Perte</button></div>

/* ---------- Mathématiques ---------- */
function Phi(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
function zinv(p){let lo=-9,hi=9;for(let i=0;i<70;i++){const m=(lo+hi)/2;if(Phi(m)<p)lo=m;else hi=m}return(lo+hi)/2}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function zbuf(N,H,seed){const r=rng(seed),z=new Float32Array(N*H);for(let i=0;i<z.length;i+=2){const u=Math.max(r(),1e-12),v=r(),m=Math.sqrt(-2*Math.log(u));z[i]=m*Math.cos(6.283185307*v);if(i+1<z.length)z[i+1]=m*Math.sin(6.283185307*v)}return z}
function wilson(k,n){if(!n)return null;const z=1.96,p=k/n,d=1+z*z/n,c=p+z*z/(2*n),s=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n));return[(c-s)/d,(c+s)/d]}
function ticks(lo,hi,n){const raw=(hi-lo)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,s=(m<1.5?1:m<3?2:m<7?5:10)*p,o=[];for(let t=Math.ceil(lo/s)*s;t<=hi+1e-9;t+=s)o.push(+t.toFixed(10));return o}
const nreq=(p0,p1,a,pw)=>{const za=zinv(1-a/2),zb=zinv(pw);return Math.ceil(Math.pow((za*Math.sqrt(p0*(1-p0))+zb*Math.sqrt(p1*(1-p1)))/(p1-p0),2))};

/* ---------- Calculs de compte ---------- */
function derive(st){
  const r=st.rules,size=num(r.size),target=num(r.target),dl=num(r.dailyLoss),dd=num(r.maxDD),minD=num(r.minDays),cons=num(r.consistency);
  const by={};st.sessions.forEach(s=>{by[s.date]=(by[s.date]||0)+s.pnl});
  const days=Object.keys(by).sort();let cum=0,hwm=0,best=0;const curve=[{d:null,v:0}];
  days.forEach(d=>{cum+=by[d];hwm=Math.max(hwm,cum);if(by[d]>best)best=by[d];curve.push({d:d,v:cum})});
  let floor=null;if(dd!=null)floor=r.ddType==="static"?-dd:(r.lock?Math.min(hwm-dd,0):hwm-dd);
  const tp=by[today()]||0;
  return{size,target,dl,dd,minD,cons,profit:cum,hwm,floor,curve,days:days.length,by,balance:size==null?null:size+cum,
    ddLeft:floor==null?null:cum-floor,dayLeft:dl==null?null:Math.max(0,dl+Math.min(0,tp)),todayPnl:tp,
    pct:target?Math.max(0,Math.min(1,cum/target)):null,share:cum>0?best/cum:null,ready:size!=null&&target!=null};
}

          lsSet("palier_v2",S);if(!isEditing())render()}
        else if(S.sessions.length||S.rules.size!==""){persist()}},()=>setSync(false))});
  }).catch(()=>{});
}

/* ---------- Graphique à la TradingView ---------- */
const TV={};let tvN=0;
function tv(o){
  const id="c"+(++tvN),W=o.w||360,H=o.h||250,Lm=6,Rm=56,Tm=10,Bm=o.xt?22:8,pw=W-Lm-Rm,ph=H-Tm-Bm;
  const xs=[],ys=[];(o.series||[]).forEach(s=>{s.x.forEach(v=>xs.push(v));s.y.forEach(v=>ys.push(v))});(o.levels||[]).forEach(l=>ys.push(l.y));
  let x0=o.x0!=null?o.x0:Math.min.apply(null,xs),x1=o.x1!=null?o.x1:Math.max.apply(null,xs);if(!(x1>x0))x1=x0+1;
  let lo=o.y0!=null?o.y0:Math.min.apply(null,ys),hi=o.y1!=null?o.y1:Math.max.apply(null,ys);if(!(hi>lo))hi=lo+1;
  const pad=(hi-lo)*.07;if(o.y0==null)lo-=pad;if(o.y1==null)hi+=pad;
  const X=v=>Lm+(v-x0)/(x1-x0)*pw,Y=v=>Tm+(hi-v)/(hi-lo)*ph,fy=o.fy||(v=>nf.format(v)),fx=o.fx||(v=>nf.format(v));
  let g="";
  ticks(lo,hi,5).forEach(t=>{g+=`<line class="gl" x1="${Lm}" x2="${W-Rm}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${W-Rm+6}" y="${(Y(t)+3.5).toFixed(1)}">${esc(fy(t))}</text>`});
  (o.xt||[]).forEach(t=>{const ax=X(t.x),an=ax<Lm+22?"start":ax>W-Rm-22?"end":"middle";g+=`<line class="gl" x1="${ax.toFixed(1)}" x2="${ax.toFixed(1)}" y1="${Tm}" y2="${H-Bm}"/><text x="${ax.toFixed(1)}" y="${H-6}" text-anchor="${an}">${esc(t.l)}</text>`});
  if(o.prof){const mx=Math.max.apply(null,o.prof.map(b=>b.v))||1;o.prof.forEach(b=>{const w=b.v/mx*pw*.24,y1=Y(b.y1),y0=Y(b.y0);g+=`<rect x="${Lm}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,y0-y1-1).toFixed(1)}" fill="${b.c||"#d8d8d8"}" opacity="${b.o||.55}"/>`})}
  (o.bands||[]).forEach(b=>{const a=Y(Math.min(hi,b.y1)),c=Y(Math.max(lo,b.y0));if(c>a)g+=`<rect x="${Lm}" y="${a.toFixed(1)}" width="${pw}" height="${(c-a).toFixed(1)}" fill="${b.c}" opacity="${b.o||.08}"/>`});
  (o.series||[]).forEach((s,i)=>{
    const d=s.x.map((x,j)=>(j?"L":"M")+X(x).toFixed(1)+" "+Y(s.y[j]).toFixed(1)).join(" ");
    if(s.area&&s.x.length>1){const y0=Y(Math.max(lo,Math.min(hi,s.base!=null?s.base:lo)));g+=`<path d="${d} L${X(s.x[s.x.length-1]).toFixed(1)} ${y0.toFixed(1)} L${X(s.x[0]).toFixed(1)} ${y0.toFixed(1)}Z" fill="${s.color}" opacity="${s.area}" class="fadein"/>`}
    g+=`<path class="draw" pathLength="1" d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.8}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.o||1}" style="animation-delay:${(s.delay||0).toFixed(2)}s"/>`});
  (o.levels||[]).forEach(l=>{const y=Y(l.y).toFixed(1);
    g+=`<line x1="${Lm}" x2="${W-Rm}" y1="${y}" y2="${y}" stroke="${l.c}" stroke-width="1" class="${l.march?"march":""}" ${l.march?"":'stroke-dasharray="5 4"'}/>`;
    g+=`<g class="tg"><rect x="${W-Rm+1}" y="${(Y(l.y)-8).toFixed(1)}" width="${Rm-2}" height="16" fill="${l.c}"/><text x="${W-Rm+5}" y="${(Y(l.y)+3.5).toFixed(1)}">${esc(l.l)}</text></g>`});
  (o.vlevels||[]).forEach(l=>{const x=X(l.x).toFixed(1);g+=`<line x1="${x}" x2="${x}" y1="${Tm}" y2="${H-Bm}" stroke="${l.c}" stroke-dasharray="5 4"/><text x="${(+x+4).toFixed(1)}" y="${Tm+11}" style="fill:${l.c}">${esc(l.l)}</text>`});
  const s0=(o.series||[])[0];
  if(s0&&o.last!==false&&s0.x.length){const lx=s0.x[s0.x.length-1],ly=s0.y[s0.y.length-1];
    g+=`<g class="tg"><rect x="${W-Rm+1}" y="${(Y(ly)-8).toFixed(1)}" width="${Rm-2}" height="16" fill="#fff"/><text x="${W-Rm+5}" y="${(Y(ly)+3.5).toFixed(1)}">${esc(fy(ly))}</text></g>`;
    if(o.pulse!==false)g+=`<circle cx="${X(lx).toFixed(1)}" cy="${Y(ly).toFixed(1)}" r="3" fill="${s0.color}"/><circle class="pulse" cx="${X(lx).toFixed(1)}" cy="${Y(ly).toFixed(1)}" r="3" fill="${s0.color}"/>`}
  g+=`<g class="xh"><line class="v" y1="${Tm}" y2="${H-Bm}"/><line class="h" x1="${Lm}" x2="${W-Rm}"/><g class="tg"><rect class="ty" x="${W-Rm+1}" width="${Rm-2}" height="16" fill="#fff"/><text class="tyt" x="${W-Rm+5}"></text></g><g class="tg"><rect class="tx" y="${H-Bm+1}" width="60" height="15" fill="#fff"/><text class="txt" y="${H-Bm+12}" text-anchor="middle"></text></g></g>`;
  if(s0&&o.cross!==false)TV[id]={W,Lm,Rm,Tm,Bm,X,Y,sx:s0.x,sy:s0.y,fy,fx};
  return `<svg class="tvs" data-tv="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"Graphique")}">${g}</svg>`;
}
function bindTV(root){$$("svg[data-tv]",root).forEach(svg=>{const M=TV[svg.dataset.tv],xh=$(".xh",svg);if(!M||!xh)return;
  const mv=e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*M.W;let b=0,bd=1e9;M.sx.forEach((x,i)=>{const d=Math.abs(M.X(x)-sx);if(d<bd){bd=d;b=i}});
    const px=M.X(M.sx[b]),py=M.Y(M.sy[b]);xh.classList.add("on");
    $(".v",xh).setAttribute("x1",px);$(".v",xh).setAttribute("x2",px);$(".h",xh).setAttribute("y1",py);$(".h",xh).setAttribute("y2",py);
    $(".ty",xh).setAttribute("y",py-8);$(".tyt",xh).setAttribute("y",py+3.5);$(".tyt",xh).textContent=M.fy(M.sy[b]);
    const lab=M.fx(M.sx[b]);$(".tx",xh).setAttribute("x",Math.max(0,Math.min(M.W-M.Rm-60,px-30)));$(".txt",xh).setAttribute("x",Math.max(30,Math.min(M.W-M.Rm-30,px)));$(".txt",xh).textContent=lab};
  svg.addEventListener("pointermove",mv);svg.addEventListener("pointerdown",mv);svg.addEventListener("pointerleave",()=>xh.classList.remove("on"))})}

/* ---------- Surface animée, nombres qui montent ---------- */
function drawSurf(c,t){const x=c.getContext("2d"),w=c.width,h=c.height,dpr=c.__d||1,cols=46,rows=15;x.clearRect(0,0,w,h);x.fillStyle="#e6e6e6";
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const u=i/(cols-1),v=j/(rows-1),z=Math.sin(u*7+t*6e-4)*.5+Math.sin(v*5-t*5e-4+u*3)*.35+Math.exp(-Math.pow(u-.5,2)*14)*Math.sin(t*4e-4+v*4)*.7;
    const px=w*(.03+.94*u)+(v-.5)*w*.16,py=h*(.9-.55*v)-z*h*.14;x.globalAlpha=Math.max(.04,Math.min(.55,.1+.3*(1-v)+.18*z));x.fillRect(px,py,1.6*dpr,1.6*dpr)}x.globalAlpha=1}
let rafId=0,lastT=0;
function loop(t){$$("canvas.terr").forEach(c=>drawTerr(c,t));$$("canvas.surf").forEach(c=>drawSurf(c,t));$$("canvas.flow").forEach(c=>drawFlow(c,t));if(!REDUCED&&!document.hidden)rafId=requestAnimationFrame(tt=>{if(tt-lastT>33){lastT=tt;loop(tt)}else rafId=requestAnimationFrame(loop)})}
function startSurf(){cancelAnimationFrame(rafId);$$("canvas.terr").forEach(c=>{if(c.dataset.terr==="bg")setTimeout(()=>{ensureBG(c);loop(performance.now())},40);else prepTerr(c)});$$("canvas.flow").forEach(prepFlow);$$("canvas.surf").forEach(c=>{const d=Math.min(2,devicePixelRatio||1);c.__d=d;c.width=c.clientWidth*d;c.height=c.clientHeight*d});loop(performance.now())}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)startSurf()});

/* ---------- Graphe de flux : blocs, bus central, impulsions ---------- */
const FLOW={};let flowN=0;
function flowHTML(spec,h){const id="f"+(++flowN);FLOW[id]=spec;return `<canvas class="flow" data-flow="${id}" style="height:${h||270}px" role="img" aria-label="${esc(spec.label)}"></canvas>`}
function prepFlow(c){
  const spec=FLOW[c.dataset.flow];if(!spec)return;const d=Math.min(2,devicePixelRatio||1),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;
  c.width=Math.round(w*d);c.height=Math.round(h*d);c.__d=d;
  const nw=Math.min(116,Math.round(w*.31)),nh=46,r=rng(spec.seed||9),bx=w/2;
  const place=(arr,x)=>arr.map((n,i)=>({n,x,y:arr.length===1?(h-nh)/2:6+(h-nh-12)*i/(arr.length-1),w:nw,h:nh}));
  const ln=place(spec.left,8),rn=place(spec.right,w-8-nw),cur=[],PORTS=4;
  const slots=[];const total=(ln.length+rn.length)*PORTS;for(let i=0;i<total;i++)slots.push(16+(h-32)*i/(total-1));

const ZC={};
function simPass(P,mu,keep){
  const key=P.N+"_"+P.H;if(!ZC[key])ZC[key]=zbuf(P.N,P.H,20260);const Z=ZC[key];
  let pass=0,days=0;const paths=[],term=[];
  for(let n=0;n<P.N;n++){let c=0,hw=0,out=0,d,pa=keep&&n<keep?[0]:null;
    for(d=1;d<=P.H;d++){const pnl=mu+P.sigma*Z[n*P.H+d-1];c+=pnl;if(pa)pa.push(c);
      if(P.dl&&pnl<=-P.dl){out=-1;break}if(c>hw)hw=c;
      const fl=P.ddType==="static"?-P.D:(P.lock?Math.min(hw-P.D,0):hw-P.D);if(c<=fl){out=-1;break}
      if(c>=P.T&&d>=P.minD){out=1;break}}
    if(out===1){pass++;days+=d}term.push(c);if(pa)paths.push({p:pa,o:out})}
  return{p:pass/P.N,days:pass?days/pass:null,paths,term};
}

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px"><button class="btn" data-obs="T" style="padding:0">Cible</button><button class="btn" data-obs="S" style="padding:0">Stop</button><button class="btn" data-obs="X" style="padding:0">Séance</button></div>
    <button class="link" data-act="undo-obs">Annuler la dernière</button>`;
  if(A.n){
    const x=[],y=[];let c=0;st.obs.forEach((o,i)=>{c+=o.r;x.push(i+1);y.push(c)});x.unshift(0);y.unshift(0);
    h+=`<div class="stats" style="margin-top:14px">${sc("n",String(A.n))}${sc("Taux observé",pct(A.ph))}${sc("Loi nulle",pct(A.p0))}${sc("Équilibre",pct(A.pbe))}${sc("p-valeur",pval(A.pv))}${sc("E[R] observée",A.mr==null?"—":(A.mr>=0?"+":"−")+nf2.format(Math.abs(A.mr))+" R",A.mr>=0?"gain":"loss")}</div>
    <p class="verdict ${A.v[1]}">${esc(A.v[0])}</p>`;
    h+=`<div style="margin-top:16px">${tv({h:190,series:[{x:x,y:y,color:c>=0?"#4fe3a1":"#e8736c",w:1.8,area:.1,base:0}],x0:0,x1:Math.max(1,x[x.length-1]),fy:v=>nf1.format(v)+" R",fx:v=>"obs. "+Math.round(v),label:"R cumulé"})}${fig(1,"R cumulé observation par observation. L'axe de droite est en multiples du risque.")}</div>`;
    if(A.ci&&A.p0!=null)h+=`<div style="margin-top:16px">${dumb(A)}${fig(2,"Taux observé avec son intervalle à 95 %. Trait blanc : loi nulle. Pointillé : équilibre avec friction.")}</div>`;
    if(A.by.pos.n+A.by.neg.n)h+=`<div style="margin-top:14px"><p class="eyebrow">Selon le régime gamma relevé à l'observation</p><table class="t"><tr><th>Régime</th><th>n</th><th>Taux</th></tr><tr><td>Positif</td><td class="m">${A.by.pos.n}</td><td class="m">${A.by.pos.n?pct(A.by.pos.k/A.by.pos.n):"—"}</td></tr><tr><td>Négatif</td><td class="m">${A.by.neg.n}</td><td class="m">${A.by.neg.n?pct(A.by.neg.k/A.by.neg.n):"—"}</td></tr></table></div>`;
    h+=`<div class="stats two" style="margin-top:14px">${sc("Trades requis (80 %)",A.need?nf.format(A.need):"—")}${sc("Seuil α corrigé",nf2.format(A.alpha*100)+" %")}</div>`;
  }else h+=`<p class="mut" style="margin:14px 0 0">Aucune observation. Déclare la géométrie, puis ajoute chaque trade pris sur ce setup. Le régime gamma courant s'y attache tout seul.</p>`;
  h+=`</section>`;
  const rows=STUDIES.map(s=>{const a=studyStats(pp.studies[s.k]);return `<tr><td>${esc(s.n)}</td><td class="m">${a.n}</td><td class="m">${pct(a.ph)}</td><td class="m">${pct(a.p0)}</td><td class="m">${pval(a.pv)}</td></tr>`}).join("");
  h+=`<section class="panel paper"><h3 class="sec"><i>3</i>Résultats</h3><div class="scrollx"><table class="t"><tr><th>Étude</th><th>n</th><th>Taux</th><th>Nul</th><th>p</th></tr>${rows}</table></div><p class="cap"><b>TABLE 1</b>Les quatre études, mêmes règles. Seuil : p &lt; ${nf2.format(.05/STUDIES.length*100)} %.</p></section>
  <section class="panel paper"><h3 class="sec"><i>4</i>Limites</h3><p class="mut" style="margin:0">Les observations sont déclaratives : un trade oublié biaise le taux. La loi nulle suppose que la séance ne borne pas l'objectif. Le niveau et sa confirmation doivent être écrits avant de regarder le résultat.</p></section>`;
  return h;
}

function paperFlow(st,A){
  const ok=k=>String(st[k]||"").trim()?"déclaré":"vide",ck=k=>String(st[k]||"").trim()?"#4fe3a1":"#555555";
  const sp=A.v[0].indexOf("Puissance")===0?"PUISSANCE":A.v[0].indexOf("Compatible")===0?"COMPATIBLE":A.v[0].indexOf("Excès")===0?"EXCÈS":A.v[0].indexOf("Défaut")===0?"DÉFAUT":"EN ATTENTE";
  const spec={seed:7,bus:"n = "+A.n,label:"Chaîne de l'étude : du setup déclaré au verdict",
    left:[{l:"NIVEAU",v:ok("niv"),c:ck("niv")},{l:"CONTACT",v:ok("contact"),c:ck("contact")},{l:"CONFIRMATION",v:ok("conf"),c:ck("conf")},{l:"INVALIDATION",v:ok("inval"),c:ck("inval")}],
    right:[{l:"LOI NULLE",v:pct(A.p0),c:"#ffffff"},{l:"P-VALEUR",v:pval(A.pv),c:"#8f6bff"},{l:"VERDICT",v:sp,c:A.v[1]==="gain"?"#4fe3a1":A.v[1]==="loss"?"#e8736c":"#9a9a9a"}]};
  return `<div style="margin:14px 0 18px">${flowHTML(spec,280)}${fig(0,"Setup déclaré à gauche, mesures à droite. Un bloc gris est un champ encore vide.")}</div>`;
}
function dumb(A){
  const W=360,H=84,Lm=14,Rm=14,pw=W-Lm-Rm,X=v=>Lm+v*pw;let g="";
  [0,.25,.5,.75,1].forEach(t=>{g+=`<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="10" y2="56"/><text x="${X(t)}" y="72" text-anchor="middle">${nf.format(t*100)} %</text>`});
  const c=A.ph>=A.p0?"#4fe3a1":"#e8736c";
  g+=`<line x1="${X(A.ci[0])}" x2="${X(A.ci[1])}" y1="33" y2="33" stroke="${c}" stroke-width="3" class="fadein"/><circle cx="${X(A.ph)}" cy="33" r="5" fill="${c}"/><circle class="pulse" cx="${X(A.ph)}" cy="33" r="5" fill="${c}"/>`;
  g+=`<line x1="${X(A.p0)}" x2="${X(A.p0)}" y1="12" y2="54" stroke="#fff" stroke-width="2"/>`;
  if(A.pbe!=null)g+=`<line x1="${X(Math.min(1,A.pbe))}" x2="${X(Math.min(1,A.pbe))}" y1="12" y2="54" stroke="#e9b44c" stroke-dasharray="4 3"/>`;
  return `<svg class="tvs" viewBox="0 0 ${W} ${H}" role="img" aria-label="Taux observé et loi nulle">${g}</svg>`;
}

/* ---------- Lecture de l'export du robot : port de pine/alp0-gex.pine ---------- */
function gexCode(tag,pref){
  const s=String(tag||"").toLowerCase().trim();let c="";
  if(!s)c="";else if(s.indexOf("macro")>=0||s==="rm")c="RM";else if(s.indexOf("flip")>=0||s.indexOf("hvl")>=0)c="HVL";
  else if(s.indexOf("max pain")>=0||s.indexOf("maxpain")>=0||s==="mp")c="MP";else if(s.indexOf("gamma wall")>=0||s.indexOf("major wall")>=0||s==="gw")c="GW";
  else if(s.indexOf("call")>=0||s.indexOf("resist")>=0||s==="cr")c="CR";else if(s.indexOf("put")>=0||s.indexOf("support")>=0||s==="ps")c="PS";else c=s.toUpperCase();
  const deja=/^\d/.test(c);return c===""||pref===""||deja||c==="RM"?c:pref+c;
}
function parseGex(text,spot0,base){
  const clean=s=>{const c=String(s).replace(/[*`$\s,]/g,"");return /^-?\d+(\.\d+)?$/.test(c)?parseFloat(c):null};
  const tagOf=s=>String(s).replace(/[*`_#]/g," ").replace(/^[\s\-•]+/,"").replace(/[\s:|=]+$/,"").toLowerCase().trim();
  let sec="niveaux",pref="",spot=spot0,net=null,netTxt="";const raw=[];
  String(text).split(/\r?\n/).forEach(r0=>{const r=r0.trim();if(!r)return;
    if(r[0]==="#"){const l=r.toLowerCase();sec=/level|niveau/.test(l)?"niveaux":/context/.test(l)?"contexte":/data|donn/.test(l)?"data":"autre";if(sec==="contexte")pref="";return}
    if(/strike/i.test(r)&&r.indexOf(",")>=0){sec="data";return}
    if(sec==="data"||sec==="autre")return;
    const m=r.match(/[=:|]/),i=m?r.indexOf(m[0]):-1,L=i<0?r:r.slice(0,i),R=i<0?"":r.slice(i+1);
    if(sec==="contexte"){
      const d=r.match(/(\d+)\s*dte/i);if(d&&/horizon|dte|expir|echeance|échéance/i.test(r))pref=d[1];
      if(spot==null&&/spot|price|prix|last|close|underlying/i.test(L)){const v=clean(R);if(v!=null&&v>100)spot=v}
      return}
    if(/net/i.test(r)&&/gex|gamma/i.test(r)){const q=r.match(/-?\s*\d[\d,]*\.?\d*\s*[KMBkmb]?\b/);if(q&&net==null){const v=parseFloat(q[0].replace(/[\s,]/g,""));if(isFinite(v)&&v!==0){net=v;netTxt=q[0].replace(/\s+/g,"")}}}
    let v=clean(L),tg=tagOf(R);if(v==null){v=clean(R);tg=tagOf(L)}
    if(v!=null)raw.push({v:v,tag:tg,pref:pref})});
  if(!raw.length)return{err:"Aucun niveau lu. Colle la réponse entière du robot."};
  /* échelle : avec ou sans la base, la plus proche du prix */
  const med=raw.map(x=>x.v).sort((a,b)=>a-b)[Math.floor(raw.length/2)];let applied=0,note="";
  if(spot!=null&&base!=null&&base!==0){const e0=Math.abs(med-spot),e1=Math.abs(med+base-spot);if(e1<=e0)applied=base;note=" · base "+(applied?"appliquée":"non appliquée")+" (écarts "+nf1.format(e0)+" sans, "+nf1.format(e1)+" avec)"}
  const levels=[];
  raw.forEach(x=>{const v=x.v+applied;if(spot!=null&&Math.abs(v-spot)>spot*.03)return;
    const code=gexCode(x.tag,x.pref),j=levels.findIndex(y=>Math.abs(y.v-v)<.25&&y.pref===x.pref);
    if(j>=0){if(code&&levels[j].code.indexOf(code)<0)levels[j].code+="/"+code}else levels.push({v:v,code:code,pref:x.pref,tag:x.tag})});
  if(!levels.length)return{err:"Tous les niveaux sont à plus de 3 % du prix. Vérifie le spot et la base NQ − NDX."};
  const prefs=[...new Set(levels.map(l=>l.pref))].sort((a,b)=>(+a||0)-(+b||0)),first=prefs[0],use=levels.filter(l=>l.pref===first);
  const pick=re=>{const l=use.find(y=>re.test(y.code.replace(/^\d+/,"").replace(/\/\d+/g,"/")));return l?l.v:null};
  const out={flip:pick(/HVL/),cw:pick(/CR/),pw:pick(/PS/),gw:pick(/GW/),mp:pick(/MP/)};
  return{out:out,spot:spot,net:net,netTxt:netTxt,applied:applied,note:note,levels:levels,first:first,others:prefs.slice(1)};
}
function applyGex(sel){
  const txt=$(sel||"#g-paste").value,spot0=num(RG&&RG.spot),base=num(RG&&RG.base),P2=parseGex(txt,spot0,base);
  if(P2.err){gexRes={t:P2.err,err:true};gexOpen=true;render();setTimeout(()=>{const a=$("#g-paste2");if(a)a.focus()},50);return}
  const o=P2.out;RG=Object.assign({},RG||{});
  ["flip","cw","pw","gw","mp"].forEach(k=>{if(o[k]!=null)RG[k]=Math.round(o[k]*100)/100});
  if(P2.spot!=null&&spot0==null)RG.spot=P2.spot;
  const sp=num(RG.spot),fl=num(RG.flip);let how="";
  if(P2.net!=null){RG.reg=P2.net>=0?"pos":"neg";how="signe du GEX net lu dans l'export"}
  else if(sp!=null&&fl!=null){RG.reg=sp>=fl?"pos":"neg";how="calculé : spot "+(sp>=fl?"au-dessus":"sous")+" le flip"}
  if(P2.net!=null)RG.net=(P2.net>0?"+":"")+P2.netTxt;
  RG.asOf=Date.now();saveRG();gexOpen=false;
  const names=P2.levels.filter(l=>l.pref===P2.first).map(l=>l.code+" "+nf.format(l.v)).join(" · ");
  gexRes={t:"Lu : "+names+P2.note+(how?" · régime : "+how:" · régime à saisir (pas de flip ou de spot)")+(P2.others.length?" · autres échéances ignorées : "+P2.others.join(", ")+" j":"")};
  render();
}

    case"del":if(!delArmed){delArmed=true;$("#del").textContent="Confirmer la suppression"}else{S.sessions=S.sessions.filter(x=>x.id!==editing);persist();closeSheet();toast("Séance supprimée");render()}break;
    case"undo-obs":if(!demo){S.paper.studies[studyK].obs.pop();persist();render()}break;
    case"demo-on":demo=true;go("apercu");break;case"demo-off":demo=false;render();break;
    case"clear-taps":taps=[];lsSet("palier_taps",taps);render();break;
    case"wipe":if(t.dataset.armed){S={rules:Object.assign({},EMPTY_RULES),sessions:[],paper:JSON.parse(JSON.stringify(EMPTY_PAPER))};RG=null;persist();saveRG();taps=[];lsSet("palier_taps",taps);Q={};lsSet("palier_q",Q);render();toast("Données effacées")}else{t.dataset.armed="1";t.textContent="Confirmer : tout effacer"}break}
});

  if(d.rule){const v=t.value;S.rules[d.rule]=d.rule==="name"?v:(num(v)==null?"":num(v));persist();return}
  if(d.rg){const v=t.value;RG=Object.assign({},RG||{});RG[d.rg]=d.rg==="net"?v:(num(v)==null?"":num(v));RG.asOf=Date.now();saveRG();return}
